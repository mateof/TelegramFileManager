name: Docker Image CI (Dev)

on:
  push:
    branches: [ "develop" ]
    # A test image of any commit, before it reaches develop: push a tag named
    # dev-<name> (git tag dev-folder-tree && git push origin dev-folder-tree) and
    # it is published as dev_<name> and dev_<name>-lite, and as dev_latest and
    # dev_latest-lite like any develop build.
    tags: [ "dev-*" ]

jobs:

  build:

    # Bringing develop up to a release (the release merge itself) is not a new
    # dev build: the release already has its own image. "[skip ci]" commits are
    # skipped by GitHub.
    if: ${{ !(startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/release/')) }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        if [ "${{ github.ref_type }}" = "tag" ]; then
          # dev-folder-tree -> image dev_folder-tree, version 0.0.0-dev.folder-tree.abc1234
          NAME=$(echo "${GITHUB_REF_NAME#dev-}" | tr -c 'A-Za-z0-9.\n-' '-')
          VERSION="0.0.0-dev.${NAME}.${SHORT_SHA}"
          echo "tag=dev_${NAME}" >> $GITHUB_OUTPUT
        else
          # Generate dev version: 0.0.0-dev.YYYYMMDD.HHMMSS.shortsha
          DATE_VERSION=$(date +%Y%m%d.%H%M%S)
          VERSION="0.0.0-dev.${DATE_VERSION}.${SHORT_SHA}"
          echo "tag=dev_${VERSION}" >> $GITHUB_OUTPUT
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GHCR}}

    - name: Build and Push Full Image (with FFmpeg)
      run: |
        VERSION=${{ steps.version.outputs.version }}
        IMAGE=ghcr.io/mateof/telegramfilemanager
        TAG=${{ steps.version.outputs.tag }}
        echo "Building full image with FFmpeg support..."
        docker build ./TelegramDownloader -f ./TelegramDownloader/Dockerfile \
          --build-arg VERSION=$VERSION \
          --build-arg INCLUDE_FFMPEG=true \
          --tag $IMAGE:$TAG \
          --tag $IMAGE:dev_latest
        docker push $IMAGE:$TAG
        docker push $IMAGE:dev_latest

    - name: Build and Push Lite Image (without FFmpeg)
      run: |
        VERSION=${{ steps.version.outputs.version }}
        IMAGE=ghcr.io/mateof/telegramfilemanager
        TAG=${{ steps.version.outputs.tag }}
        echo "Building lite image without FFmpeg..."
        docker build ./TelegramDownloader -f ./TelegramDownloader/Dockerfile \
          --build-arg VERSION=$VERSION \
          --build-arg INCLUDE_FFMPEG=false \
          --tag $IMAGE:$TAG-lite \
          --tag $IMAGE:dev_latest-lite
        docker push $IMAGE:$TAG-lite
        docker push $IMAGE:dev_latest-lite
