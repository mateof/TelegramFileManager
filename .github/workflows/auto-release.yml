name: Release

# How a version is released (see docs/releases.md):
#
#   1. Open an issue titled with the version (e.g. "v3.9.0") and label it
#      `release`, or run this workflow by hand with the version.
#   2. The workflow branches release/<version> off develop, bumps the version
#      and opens ONE pull request into main with everything develop has, and
#      release notes made of the pull requests merged since the last tag.
#   3. Merge that pull request with "Create a merge commit".
#   4. The workflow tags the merge, publishes the GitHub Release (which builds
#      the binaries and the release Docker image) and brings develop up to main
#      without a dev Docker image.
#
# Merge commits keep main and develop on the same history. Squashing or
# rebasing the release pull request makes them diverge, and the next release
# conflicts on every file both touched.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 3.9.0)'
        type: string
        required: true
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Only these users can start a release (comma-separated GitHub usernames)
  ALLOWED_USERS: "mateof"

jobs:
  # ===========================================
  # JOB 1: Release branch off develop and pull request into main
  # ===========================================
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'release')

    steps:
      - name: '🔐 Verify user authorization'
        env:
          REQUESTER: ${{ github.event_name == 'issues' && github.event.issue.user.login || github.actor }}
        run: |
          if [[ ! ",$ALLOWED_USERS," == *",$REQUESTER,"* ]]; then
            echo "❌ User '$REQUESTER' is not authorized to create releases"
            exit 1
          fi
          echo "✅ User '$REQUESTER' is authorized"

      - name: '📋 Read the version'
        id: version
        env:
          SOURCE: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.version }}
        run: |
          # Supports v3.9.0, 3.9.0 and 3.9.0.0
          VERSION=$(echo "$SOURCE" | grep -oE '[vV]?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$VERSION" ]; then
            echo "❌ No version found in '$SOURCE'"
            exit 1
          fi
          VERSION=${VERSION#[vV]}
          if [ "$(echo "$VERSION" | tr '.' '\n' | wc -l)" -eq 3 ]; then
            VERSION_CSPROJ="${VERSION}.0"
          else
            VERSION_CSPROJ="$VERSION"
          fi
          {
            echo "version=$VERSION"
            echo "version_csproj=$VERSION_CSPROJ"
            echo "version_tag=v$VERSION"
            echo "branch_name=release/$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Version: $VERSION | csproj: $VERSION_CSPROJ"

      - name: '📄 Checkout develop'
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: '🔍 Check the tag is new'
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag '$TAG' already exists"
            exit 1
          fi

      - name: '🌿 Release branch off develop, with main in its history'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.version.outputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A branch left by a previous failed run
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || true
          fi

          git checkout -b "$BRANCH"
          # Normally main is already in develop (the last release was brought
          # back). If it is not, merge it here so the pull request has no
          # conflicts; if that conflicts, a person has to look at it.
          if ! git merge-base --is-ancestor origin/main HEAD; then
            if ! git merge --no-ff origin/main -m "Merge main into ${BRANCH}"; then
              git merge --abort || true
              echo "❌ main and develop conflict. Merge main into develop by hand, then label the issue again."
              exit 1
            fi
          fi

      - name: '📝 Bump the version'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CSPROJ="${{ steps.version.outputs.version_csproj }}"

          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION_CSPROJ</Version>|g" TelegramDownloader/TelegramDownloader.csproj

          CSPROJ="TFMAudioApp/TFMAudioApp.csproj"
          if [ -f "$CSPROJ" ]; then
            sed -i "s|<ApplicationDisplayVersion>[^<]*</ApplicationDisplayVersion>|<ApplicationDisplayVersion>$VERSION</ApplicationDisplayVersion>|g" "$CSPROJ"
            sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION_CSPROJ</Version>|g" "$CSPROJ"
          fi

          git add -A
          git diff --staged --quiet || git commit -m "Bump version to $VERSION"
          # Pushed with GITHUB_TOKEN: it starts no workflow, so no Docker image.
          git push origin "${{ steps.version.outputs.branch_name }}"

      - name: '📰 Release notes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          BRANCH="${{ steps.version.outputs.branch_name }}"
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/main 2>/dev/null || true)

          {
            if [ -n "$ISSUE_BODY" ]; then
              printf '%s\n\n' "$ISSUE_BODY"
            fi
            # The pull requests merged since the last release, as GitHub lists them
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$BRANCH" \
              ${PREVIOUS:+-f previous_tag_name="$PREVIOUS"} --jq .body
          } > release_notes.md
          cat release_notes.md

      - name: '🔀 Pull request into main'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          {
            cat release_notes.md
            echo
            echo "<!-- release-notes-end -->"
            echo "---"
            echo "Develop, with the version set to **${{ steps.version.outputs.version }}**."
            echo
            echo "> **Merge with \"Create a merge commit\"**, not squash nor rebase: then main and develop keep one history and the next release has no conflicts."
            echo "> After the merge the workflow tags \`$TAG\`, publishes the release (binaries and Docker image) and brings develop up to main."
            if [ -n "$ISSUE_NUMBER" ]; then
              echo
              echo "Closes #$ISSUE_NUMBER"
            fi
          } > pr_body.md

          PR_URL=$(gh pr create --base main --head "${{ steps.version.outputs.branch_name }}" \
            --title "Release $TAG" --body-file pr_body.md)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "✅ $PR_URL"

      - name: '💬 Comment on the issue'
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Release pull request: ${{ steps.create_pr.outputs.pr_url }}

          Merge it with **Create a merge commit** and the rest is automatic."

      - name: '❌ Comment on failure'
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "The release pull request could not be created: see the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Usual causes: no version in the title (use v3.9.0), a tag that already exists, or main and develop in conflict."

  # ===========================================
  # JOB 2: Tag, release and develop up to main
  # ===========================================
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    steps:
      - name: '📋 Version from the branch'
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION=${BRANCH#release/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: '📄 Checkout main'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.TOKENBuild }}

      - name: '🏷️ Tag'
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "${{ github.event.pull_request.merge_commit_sha }}"
          # With TOKENBuild the tag starts the release Docker image workflow.
          git push origin "$TAG"

      - name: '🚀 GitHub Release'
        env:
          GH_TOKEN: ${{ secrets.TOKENBuild }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The notes are the body of the pull request, without its footer.
          printf '%s\n' "$PR_BODY" | sed '/<!-- release-notes-end -->/,$d' > release_notes.md
          gh release create "${{ steps.version.outputs.version_tag }}" \
            --title "Release ${{ steps.version.outputs.version_tag }}" \
            --notes-file release_notes.md \
            --verify-tag

      - name: '🔄 Bring develop up to main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.TOKENBuild }}
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"
          git fetch origin develop

          if [ "$(git cat-file -p "$MERGE" | grep -c '^parent ')" -lt 2 ]; then
            echo "::warning::The release pull request was squashed or rebased: main and develop no longer share history and the next release will conflict."
          fi

          git checkout -B develop origin/develop
          FAILED=
          if git merge-base --is-ancestor origin/develop origin/main; then
            # Nothing new on develop meanwhile: develop simply becomes main.
            git merge --ff-only origin/main
          elif ! git merge --no-ff origin/main -m "Sync develop with main after $TAG [skip ci]"; then
            git merge --abort || true
            FAILED=1
          fi

          # TOKENBuild can skip the pull request that develop requires. What is
          # pushed is the release merge, or a commit that says [skip ci]; the
          # dev Docker workflow skips both.
          if [ -z "$FAILED" ] && git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" develop; then
            echo "✅ develop is up to main"
          else
            # Last resort, as before: a pull request to merge by hand (with a merge commit).
            SYNC="sync/main-to-develop-$TAG"
            git push origin "origin/main:refs/heads/$SYNC"
            gh pr create --base develop --head "$SYNC" \
              --title "Sync develop with main after $TAG" \
              --body "develop could not be brought up to main on its own. Merge with **Create a merge commit**."
          fi

      - name: '🗑️ Delete the release branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" || true
